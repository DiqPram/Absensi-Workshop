<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Workshop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="py-4 px-6 border-b border-slate-800 bg-slate-900 text-center">
        <h1 class="text-sm font-bold text-indigo-400">ABSENSI WORKSHOP</h1>
        <p class="text-xs text-slate-400">Scan QR Code Peserta</p>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        
        <!-- Peringatan Device Terkunci -->
        <div id="device-locked-alert" class="hidden bg-rose-950 border border-rose-600 rounded-2xl p-6 text-center">
            <h2 class="font-bold text-rose-200 text-lg mb-2">Perangkat Telah Digunakan</h2>
            <p class="text-xs text-rose-300">Perangkat ini sudah mencatatkan kehadiran sebelumnya.</p>
        </div>

        <!-- Kartu Utama Scanner -->
        <div id="absensi-card" class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
            <div class="text-center mb-4">
                <h2 class="text-sm font-semibold text-white">Arahkan Kamera ke QR Code</h2>
                <p id="status-teks" class="text-xs text-indigo-400 mt-1">Memuat kamera...</p>
            </div>

            <!-- Elemen Kamera -->
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black mb-4"></div>

            <div id="info-hasil" class="text-center text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800">
                Menunggu pemindaian QR Code...
            </div>

            <!-- Box Sukses -->
            <div id="success-box" class="hidden mt-4 bg-emerald-950 border border-emerald-600 rounded-xl p-4 text-xs space-y-1">
                <p class="font-bold text-emerald-400 text-sm mb-2">✅ Absensi Berhasil!</p>
                <p><strong>Nama:</strong> <span id="res-nama">-</span></p>
                <p><strong>Email:</strong> <span id="res-email">-</span></p>
                <p><strong>Instansi:</strong> <span id="res-univ">-</span></p>
                <button onclick="location.reload()" class="mt-3 w-full bg-emerald-600 text-white py-2 rounded-lg font-medium">Scan Lagi</button>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 Sistem Presensi Workshop
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykVPTwoq-OlTlaW2j1RMlCt_p_0eQziJNPf3-_pDoBdYdLQy2_Hra73QrDnB6Jk_xWyw/exec"; // Ganti dengan URL /exec Anda
        let deviceId = "";

        window.addEventListener('load', async () => {
            const fp = await FingerprintJS.load();
            const result = await fp.get();
            deviceId = result.visitorId;

            if (localStorage.getItem('workshop_device_locked')) {
                document.getElementById('absensi-card').classList.add('hidden');
                document.getElementById('device-locked-alert').classList.remove('hidden');
                return;
            }

            startScanner();
        });

        function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    html5QrCode.stop().then(() => {
                        document.getElementById('status-teks.').innerText = "Memproses data...";
                        document.getElementById('info-hasil').innerText = "⏳ Mencocokkan dengan Google Sheets...";
                        sendDataToServer(decodedText, deviceId);
                    }).catch(err => console.log(err));
                },
                (errorMessage) => {
                    // Error scan per frame diabaikan agar tidak spam
                }
            ).then(() => {
                document.getElementById('status-teks').innerText = "Kamera Aktif 🟢";
            }).catch(err => {
                document.getElementById('status-teks').innerText = "Kamera Gagal 🔴";
                document.getElementById('info-hasil').innerText = "⚠️ Izinkan akses kamera pada browser Chrome Anda.";
            });
        }

        async function sendDataToServer(qrValue, deviceId) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ qrValue, deviceId })
                });
                const result = await response.json();

                if (result.status === "success") {
                    localStorage.setItem('workshop_device_locked', 'true');
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('info-hasil').style.display = 'none';
                    document.getElementById('status-teks').innerText = "Berhasil!";
                    
                    document.getElementById('res-nama').innerText = result.data.nama;
                    document.getElementById('res-email').innerText = result.data.email;
                    document.getElementById('res-univ').innerText = result.data.universitas;
                    document.getElementById('success-box').classList.remove('hidden');
                } else {
                    alert("⚠️ " + result.message);
                    location.reload();
                }
            } catch (error) {
                alert("❌ Gagal terhubung ke server.");
                location.reload();
            }
        }
    </script>
</body>
</html>
