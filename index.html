<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Workshop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="py-4 px-6 border-b border-slate-800 bg-slate-900 text-center">
        <h1 class="text-sm font-bold text-indigo-400">ABSENSI WORKSHOP EDUKASI & LITERASI</h1>
        <p class="text-sm font-bold text-indigo-400">UNIVERSITAS PANCASILA</p>
        <p class="text-xs text-slate-400">Scan QR Code Peserta</p>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
            <div class="text-center mb-4">
                <h2 class="text-sm font-semibold text-white">Arahkan Kamera ke QR Code Peserta</h2>
                <p id="status-teks" class="text-xs text-amber-400 mt-1">Memuat kamera...</p>
            </div>

            <!-- Area Kamera -->
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black mb-4 min-h-[240px]"></div>

            <button id="btn-mulai" onclick="mulaiKamera()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-xs mb-3 transition-all">
                📷 Nyalakan Kamera Ulang
            </button>

            <div id="info-hasil" class="text-center text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800">
                Siap memindai QR code peserta berikutnya...
            </div>

            <!-- Box Hasil / Notifikasi -->
            <div id="result-box" class="hidden mt-4 p-4 rounded-xl text-xs space-y-1"></div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 Sistem Presensi Workshop
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykVPTwoq-OlTlaW2j1RMlCt_p_0eQziJNPf3-_pDoBdYdLQy2_Hra73QrDnB6Jk_xWyw/exec"; // Ganti dengan URL /exec Anda
        let html5QrCode;
        let isProcessing = false;

        window.addEventListener('load', () => {
            mulaiKamera();
        });

        function mulaiKamera() {
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('reader').style.display = 'block';
            document.getElementById('status-teks').innerText = "Meminta izin kamera...";
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    if (isProcessing) return;
                    isProcessing = true;

                    html5QrCode.stop().then(() => {
                        document.getElementById('status-teks').innerText = "Memproses...";
                        document.getElementById('info-hasil').innerText = "⏳ Memeriksa data: " + decodedText;
                        sendDataToServer(decodedText);
                    }).catch(err => {
                        isProcessing = false;
                        console.log(err);
                    });
                },
                (errorMessage) => {}
            ).then(() => {
                document.getElementById('status-teks').innerText = "Kamera Aktif 🟢";
            }).catch(err => {
                document.getElementById('status-teks').innerText = "Gagal Membuka Kamera 🔴";
            });
        }

        async function sendDataToServer(qrValue) {
            try {
                // Menggunakan mode no-cors dengan teknik kirim teks agar tembus Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ qrValue: qrValue })
                });
                
                const result = await response.json();
                const resBox = document.getElementById('result-box');
                resBox.classList.remove('hidden');
                document.getElementById('reader').style.display = 'none';

                if (result.status === "success") {
                    resBox.className = "mt-4 p-4 rounded-xl text-xs space-y-1 bg-emerald-950 border border-emerald-600 text-emerald-200";
                    resBox.innerHTML = `
                        <p class="font-bold text-sm text-emerald-400 mb-1">✅ Absensi Berhasil!</p>
                        <p><strong>Nama:</strong> ${result.data.nama}</p>
                        <p><strong>Email:</strong> ${result.data.email}</p>
                        <p><strong>Instansi:</strong> ${result.data.universitas}</p>
                        <p><strong>Prodi:</strong> ${result.data.prodi}</p>
                        <p><strong>Pekerjaan:</strong> ${result.data.pekerjaan}</p>
                        <button onclick="mulaiKamera()" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-bold">Scan Peserta Berikutnya ➡️</button>
                    `;
                } else {
                    resBox.className = "mt-4 p-4 rounded-xl text-xs space-y-1 bg-rose-950 border border-rose-600 text-rose-200";
                    resBox.innerHTML = `
                        <p class="font-bold text-sm text-rose-400 mb-1">⚠️ Gagal / Ditolak</p>
                        <p>${result.message}</p>
                        <button onclick="mulaiKamera()" class="mt-3 w-full bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-lg font-bold">Scan Ulang 🔄</button>
                    `;
                }
            } catch (error) {
                alert("❌ Gagal terhubung ke database server.");
                isProcessing = false;
                mulaiKamera();
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
